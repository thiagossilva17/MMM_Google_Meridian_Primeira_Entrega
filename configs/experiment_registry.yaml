experiments:
- id: G0
  status: planned
  future_delivery: 2
  hypothesis: Configuração GEO de referência
  changed_factor: nenhum
  fixed_factors: Dados, seed, canais e demais parâmetros do comparador; registrar
    toda exceção
  eda_evidence: Cap. 18
  expected_output: Diagnósticos de referência
  diagnostics:
  - Rhat
  - ESS
  - traces
  - PPC
  - baseline
  - estabilidade inferencial
